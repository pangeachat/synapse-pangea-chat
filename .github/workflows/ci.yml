name: CI
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check-code-style:
    name: Check code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.x"
      - run: python -m pip install tox
      - run: tox -e check_codestyle

  check-types:
    name: Check types with Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.x"
      - run: python -m pip install tox
      - run: tox -e check_types

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          # Pinned minor: matrix-synapse ships abi3 wheels, but a new Python
          # minor can still break transitive deps — bump deliberately.
          python-version: "3.13"
          cache: "pip"
      - name: Install package with dev extras
        run: |
          python -m pip install -e ".[dev]"
          # synapse 1.124.0 still imports pkg_resources, dropped in setuptools 81
          python -m pip install "setuptools<81"
      - name: Run unit tests
        # Every class that does not boot a homeserver: about 1,150 tests in
        # well under a minute. scripts/select_tests.py decides which is which;
        # it runs on its own line so a failed discovery fails the step.
        run: |
          TESTS=$(python scripts/select_tests.py unit)
          test -n "$TESTS"  # with no names, unittest would discover and run everything
          python -m unittest $TESTS

  e2e-tests:
    name: E2E tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install package with dev extras
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "setuptools<81"
      - name: Run this shard's E2E classes
        # The tests of each E2E class share one real Synapse against a throwaway
        # PostgreSQL (tests/base_e2e.py); a boot costs about 6 seconds, a test
        # about one, so the shards are balanced on boots plus tests. testing.postgresql
        # needs the server binaries (initdb + postgres) on PATH; the runner image
        # ships them under /usr/lib/postgresql/<major>/bin without exposing them.
        run: |
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          TESTS=$(python scripts/select_tests.py e2e --shard ${{ matrix.shard }} --of 4)
          test -n "$TESTS"
          PATH="$PG_BIN:$PATH" LC_ALL=C.UTF-8 LANG=C.UTF-8 \
            python -m unittest --durations 0 $TESTS

  run-tests:
    # The one result to read (and the name earlier tooling watches): green only
    # when the unit job and every E2E shard passed.
    name: Unit & integration tests
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: always()
    steps:
      - run: |
          test "${{ needs.unit-tests.result }}" = success
          test "${{ needs.e2e-tests.result }}" = success
