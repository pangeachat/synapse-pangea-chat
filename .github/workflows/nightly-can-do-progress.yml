# The nightly progress pass of the merged Can-Do switch (pangeachat/.github#832).
# Temporary: deleted with the migration endpoints (scripts/can_do_switch_data/README.md).
# Design: .github/instructions/migrate-course-progress.instructions.md, "The nightly pass".
#
# This repository is public, so its Actions logs are too: the runner prints counts
# only, and nothing is uploaded as an artifact.
name: Nightly Can-Do progress pass
run-name: "Can-Do progress pass · ${{ inputs.environment || 'staging' }}"

on:
  schedule:
    # 10:17 UTC, before the laptop job it replaces (11:00 UTC) so the two never overlap.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run the pass on"
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: can-do-nightly-progress-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  progress:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENVIRONMENT: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Check that the environment's role is configured
        env:
          ROLE_ARN: ${{ secrets.CAN_DO_NIGHTLY_ROLE_ARN_STAGING }}
        run: |
          set -euo pipefail
          if [[ "$ENVIRONMENT" != staging ]]; then
            echo "::error::only staging is configured"
            exit 1
          fi
          if [[ -z "$ROLE_ARN" ]]; then
            echo "::error::Set the CAN_DO_NIGHTLY_ROLE_ARN_STAGING repository secret"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.13"
      - name: Assume the staging nightly-pass role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CAN_DO_NIGHTLY_ROLE_ARN_STAGING }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Run the pass (counts only)
        # Standard library only: no install step. Exit 1 means a person is needed.
        run: python scripts/nightly_can_do_progress.py --environment "$ENVIRONMENT"
