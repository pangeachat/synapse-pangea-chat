# Minimum Synapse version required by this commit of synapse-pangea-chat.
# This file is read by the ansible deploy.sh script to prevent deploying
# module code to a Synapse homeserver that is too old.
#
# If this file is absent in a given commit, any Synapse version is assumed compatible.
# Do not lower min_synapse_version without auditing all sub-module imports first.

min_synapse_version: "1.159.0"
reason: "blocked_join_gate registers a check_event_allowed callback, which makes Synapse freeze every locally-created event, and Synapse 1.124's Rust push-rule evaluator rejects frozen power-levels content, so create_course_space breaks (pangeachat/.github#442). Fixed upstream in 1.159.0; the gate is on by default, so no config avoids it. delayed_push also mirrors 1.159.0's HttpPusher body under an exact runtime version guard."
