[project]
name = "synapse_pangea_chat"
description = "Unified Pangea Chat Synapse modules: public courses, room preview, room code, auto-accept invite, delete room, limit user directory"
readme = "README.md"

dynamic = ["version"]


requires-python = ">=3.10"

classifiers = ["License :: OSI Approved :: Apache Software License"]

dependencies = ["attrs", "phonenumbers"]

[project.optional-dependencies]
dev = [
  # for tests
  "matrix-synapse == 1.159.0",
  "prometheus-client == 0.22.1",
  "tox",
  "twisted == 24.7.0",
  "aiounittest",
  "aiohttp",
  "psycopg2",
  "requests",
  "testing.postgresql",
  # For the Tier 1 collision gate (tests/test_moderation_tier1_terms.py) only.
  # NEVER a runtime dependency: it carries ~324 MB of frequency data with the
  # [cjk] extra, which is what supplies the Japanese, Korean and Chinese
  # tokenizers. Without that extra those three languages raise
  # ModuleNotFoundError and drop out of the gate's coverage silently.
  "wordfreq[cjk] == 3.1.1",
  # for type checking
  "mypy == 2.1.0",
  # for linting
  "black == 23.10.0",
  "ruff == 0.1.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synapse_pangea_chat*"]

# The moderation wordlist and the Tier 1 classification are data the module
# reads at runtime. Without this they are left out of the wheel, so an
# installed build raises FileNotFoundError inside the Tier 1 profanity rule -
# and because that tier fails open, the only symptom is a warning per message
# and a moderation tier that is quietly not running.
[tool.setuptools.package-data]
synapse_pangea_chat = [
  "moderation/*.json",
  # Nudge email and unsubscribe page templates, read at runtime.
  "nudge_delivery/templates/*.html",
  "nudge_delivery/templates/*.txt",
  # The requested-course claim emails (course ready, course claimed).
  "email_invite/templates/*.html",
  "email_invite/templates/*.txt",
]

[tool.setuptools_scm]

[tool.mypy]
files = ["synapse_pangea_chat", "tests"]
disable_error_code = ["import-untyped", "no-untyped-call", "attr-defined"]
strict = false

[tool.ruff]
line-length = 88

# See https://docs.astral.sh/ruff/rules/#error-e
# for error codes. The ones we ignore are:
#  E501: Line too long (black enforces this for us)
#  E731: do not assign a lambda expression, use a def
#
# flake8-bugbear compatible checks. Its error codes are described at
# https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
#  B023: Functions defined inside a loop must not use variables redefined in the loop
ignore = ["B023", "E501", "E731"]
select = [
  # pycodestyle
  "E",
  "W",
  # pyflakes
  "F",
  # flake8-bugbear
  "B0",
  # flake8-comprehensions
  "C4",
  # flake8-2020
  "YTT",
  # flake8-slots
  "SLOT",
  # flake8-debugger
  "T10",
  # flake8-pie
  "PIE",
  # flake8-executable
  "EXE",
  # isort
  "I",
]
