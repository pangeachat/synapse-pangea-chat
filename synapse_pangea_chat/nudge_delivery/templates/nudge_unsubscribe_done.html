<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferences updated – {{ app_name }}</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f4f2fb;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1a1a2e;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
      <div style="font-weight:700;color:#5E3ACF;font-size:18px;">{{ app_name }}</div>
      <h1 style="font-size:20px;margin:16px 0 8px 0;">Done</h1>
      {% if all_off %}
      <p style="margin:0;">You won't receive reminders or offers from {{ app_name }} anymore.</p>
      {% else %}
      <p style="margin:0;">You won't receive {{ category_label }} anymore.</p>
      {% endif %}
      <p style="margin:16px 0 0 0;font-size:13px;color:#6b6b80;">Changed your mind? Turn them back on in the app under Settings &rsaquo; Notifications.</p>
    </div>
  </body>
</html>
