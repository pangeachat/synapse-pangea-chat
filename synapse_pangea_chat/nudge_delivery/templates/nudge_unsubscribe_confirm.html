{% extends "nudge_preferences_base.html" %}
{% block content %}
        <p class="eyebrow">Your inbox, your choice</p>
        <h1>Email preferences</h1>
        <p>Choose which emails you’d like to stop.</p>
        <form method="post">
          <input type="hidden" name="t" value="{{ token }}" />
          <div class="choice">
            <p class="choice-label">This email type</p>
            <p class="category">{{ category_label }}</p>
            <button class="primary" type="submit" name="scope" value="category">Unsubscribe</button>
          </div>
          <button class="secondary" type="submit" name="scope" value="all">Stop all reminders and offers</button>
        </form>
        <p class="note">You’ll still receive chat messages, course invitations, and account emails.</p>
{% endblock %}
