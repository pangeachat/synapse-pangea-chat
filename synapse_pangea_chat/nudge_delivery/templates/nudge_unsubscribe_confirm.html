<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email preferences – {{ app_name }}</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f4f2fb;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1a1a2e;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
      <div style="font-weight:700;color:#5E3ACF;font-size:18px;">{{ app_name }}</div>
      <h1 style="font-size:20px;margin:16px 0 8px 0;">Stop {{ category_label }}?</h1>
      <p style="margin:0 0 20px 0;">You can turn these back on any time in the app under Settings &rsaquo; Notifications.</p>
      <form method="post">
        <input type="hidden" name="t" value="{{ token }}" />
        <button type="submit" name="scope" value="category" style="background:#5E3ACF;color:#ffffff;border:0;padding:12px 20px;border-radius:8px;font-weight:600;cursor:pointer;">Stop {{ category_label }}</button>
        <button type="submit" name="scope" value="all" style="background:#ffffff;color:#5E3ACF;border:1px solid #5E3ACF;padding:12px 20px;border-radius:8px;font-weight:600;cursor:pointer;margin-left:8px;">Stop all reminders and offers</button>
      </form>
      <p style="margin:20px 0 0 0;font-size:13px;color:#6b6b80;">Messages from people you chat with, course invitations, and account emails are not affected.</p>
    </div>
  </body>
</html>
