{% extends "brand_base.html" %}
{% block content %}
            <tr>
              <td class="body-content" style="padding:36px 40px 24px;">
                {% if title %}<h1 style="margin:0 0 20px;font-size:24px;line-height:1.3;">{{ title }}</h1>{% endif %}
                <p style="margin:0 0 24px;white-space:pre-line;">{{ body }}</p>
                <div class="cta-block" style="text-align:center;padding:8px 0 24px;">
                  <a class="cta-button" href="{{ cta_url }}" style="display:inline-block;background-color:#5e3acf;color:#ffffff;text-decoration:none;padding:14px 32px;border-radius:18px;font-weight:600;font-size:16px;">{{ cta_label }}</a>
                </div>
              </td>
            </tr>
{% endblock %}
