{% extends "_brand_email_base.html" %}
{% from "_brand_cta_button.html" import cta_button %}
{% block content %}
            <tr>
              <td class="body-content" style="padding:36px 40px 24px;">
                {% if title %}<h1 style="margin:0 0 20px;font-size:24px;line-height:1.3;">{{ title }}</h1>{% endif %}
                <p style="margin:0 0 24px;white-space:pre-line;">{{ body }}</p>
                {% for image in images | default([]) %}
                <p style="margin:0 0 24px;">
                  <a href="{{ cta_url }}"><img src="{{ image.url }}" alt="{{ image.alt }}" width="520" style="display:block;width:100%;max-width:520px;height:auto;border:0;border-radius:12px;" /></a>
                </p>
                {% endfor %}
                {{ cta_button(cta_url, cta_label) }}
              </td>
            </tr>
{% endblock %}
